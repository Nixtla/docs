name: Nixtla Simplified Documentation (Preview)

on:
  push:
    branches: main
  workflow_dispatch:

jobs:
  build-preview-documentation:
    permissions:
        contents: write
    runs-on: ubuntu-latest
    name: Clone all built documentation
    steps:
      - name: Clone docs repository
        uses: actions/checkout@v4
        with:
          repository: Nixtla/docs
          path: docs
          ref: docs-preview

      - name: Clone statsforecast
        uses: actions/checkout@v4
        with:
          repository: Nixtla/statsforecast
          path: statsforecast
          ref: docs-preview

      - name: Clone mlforecast
        uses: actions/checkout@v4
        with:
          repository: Nixtla/mlforecast
          path: mlforecast
          ref: docs-preview

      - name: Clone neuralforecast
        uses: actions/checkout@v4
        with:
          repository: Nixtla/neuralforecast
          path: neuralforecast
          ref: docs-preview

      - name: Clone hierarchicalforecast
        uses: actions/checkout@v4
        with:
          repository: Nixtla/hierarchicalforecast
          path: hierarchicalforecast
          ref: docs-preview

      - name: Clone utilsforecast
        uses: actions/checkout@v4
        with:
          repository: Nixtla/utilsforecast
          path: utilsforecast
          ref: docs-preview

      - name: Clone datasetsforecast
        uses: actions/checkout@v4
        with:
          repository: Nixtla/datasetsforecast
          path: datasetsforecast
          ref: docs-preview

      - name: Clone coreforecast
        uses: actions/checkout@v4
        with:
          repository: Nixtla/coreforecast
          path: coreforecast
          ref: docs-preview

      - name: Clone synforecast
        uses: actions/checkout@v4
        with:
          repository: Nixtla/synforecast
          path: synforecast
          ref: docs-preview

      - name: Copy documentation and merge configs
        run: |
          cp -R statsforecast docs/
          cp -R mlforecast docs/
          cp -R neuralforecast docs/
          cp -R hierarchicalforecast docs/
          cp -R utilsforecast docs/
          cp -R datasetsforecast docs/
          cp -R coreforecast docs/
          rm -rf synforecast/.git
          cp -R synforecast docs/
          cd docs && python3 merge_docs.py

      - name: Commit and push changes
        run: |
          cd docs
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git checkout docs-preview
          # Evict any stale gitlink for synforecast from the index; git add
          # will not descend into a path the index tracks as a submodule.
          # Once the path is tracked as regular files, this unstages them
          # and the git add below restages them, leaving the tree unchanged.
          git rm -r -q --cached --ignore-unmatch -- synforecast
          git add .
          git diff-index --quiet --cached HEAD -- || git commit -m "Update documentation"
          git push origin docs-preview --force