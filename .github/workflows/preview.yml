name: Nixtla Simplified Documentation (Preview)

on:
  push:
    branches: main
  workflow_dispatch:

jobs:
  build-preview-documentation:
    permissions:
        contents: write
    runs-on: ubuntu-latest
    name: Clone all built documentation
    steps:
      - name: Clone docs repository
        uses: actions/checkout@v4
        with:
          repository: Nixtla/docs
          path: docs
          ref: docs-preview

      - name: Clone statsforecast
        uses: actions/checkout@v4
        with:
          repository: Nixtla/statsforecast
          path: statsforecast
          ref: docs-preview

      - name: Clone mlforecast
        uses: actions/checkout@v4
        with:
          repository: Nixtla/mlforecast
          path: mlforecast
          ref: docs-preview

      - name: Clone neuralforecast
        uses: actions/checkout@v4
        with:
          repository: Nixtla/neuralforecast
          path: neuralforecast
          ref: docs-preview

      - name: Clone hierarchicalforecast
        uses: actions/checkout@v4
        with:
          repository: Nixtla/hierarchicalforecast
          path: hierarchicalforecast
          ref: docs-preview

      - name: Clone utilsforecast
        uses: actions/checkout@v4
        with:
          repository: Nixtla/utilsforecast
          path: utilsforecast
          ref: docs-preview

      - name: Clone datasetsforecast
        uses: actions/checkout@v4
        with:
          repository: Nixtla/datasetsforecast
          path: datasetsforecast
          ref: docs-preview

      - name: Clone coreforecast
        uses: actions/checkout@v4
        with:
          repository: Nixtla/coreforecast
          path: coreforecast
          ref: docs-preview

      - name: Clone synforecast
        uses: actions/checkout@v4
        with:
          repository: Nixtla/synforecast
          path: synforecast
          ref: docs-preview

      - name: Copy documentation and merge configs
        run: |
          # Mirror each library's built docs into docs/<repo>. `--delete` removes
          # pages that no longer exist upstream (e.g. from an old PR preview build),
          # which a plain `cp -R` would leave behind as stale, broken pages.
          for repo in statsforecast mlforecast neuralforecast hierarchicalforecast \
                      utilsforecast datasetsforecast coreforecast synforecast; do
            rsync -a --delete --exclude .git "$repo/" "docs/$repo/"
          done
          cd docs && python3 merge_docs.py

      - name: Commit and push changes
        run: |
          cd docs
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git checkout docs-preview
          git rm -r -q --cached --ignore-unmatch -- synforecast
          git add .
          git diff-index --quiet --cached HEAD -- || git commit -m "Update documentation"
          git push origin docs-preview --force